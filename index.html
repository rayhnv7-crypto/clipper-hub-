<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clipper Hub</title><style>body{margin:0;background:#101513;color:#e7f2ec;font:15px system-ui}header{padding:22px 28px;border-bottom:1px solid #26342d;display:flex;justify-content:space-between}h1{font-size:20px;margin:0;color:#6ee7b7}nav{display:flex;gap:10px;padding:18px 28px;flex-wrap:wrap}button{background:#18241e;color:#c8e8d7;border:1px solid #2c4437;border-radius:9px;padding:10px 14px;cursor:pointer}button.active{background:#14583e;border-color:#28a879;color:white}main{padding:10px 28px 32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#17201b;border:1px solid #293a30;border-radius:14px;padding:18px}.muted{color:#8ca99a}.num{font-size:28px;color:#6ee7b7;margin-top:8px}table{width:100%;border-collapse:collapse;margin-top:14px}td,th{text-align:left;padding:11px;border-bottom:1px solid #2b3b31}input,select{background:#101713;border:1px solid #314438;color:#e7f2ec;padding:9px;border-radius:8px;margin:4px}section{margin:16px 0}.hide{display:none}</style></head><body><header><h1>Clipper Hub</h1><span class="muted">Operations Workspace</span></header><section class="card" style="margin:16px 28px"><b>Cloud Sync (Supabase)</b><input id="authEmail" type="email" placeholder="Email"><input id="authPassword" type="password" placeholder="Password"><button onclick="authAction('signup')">Daftar</button><button onclick="authAction('login')">Login</button><button onclick="cloudLoad()">Ambil Data Cloud</button><button onclick="cloudSave()">Simpan ke Cloud</button><button onclick="authAction('logout')">Logout</button><span id="cloudStatus" class="muted">Belum login</span></section><nav><button class="active" data-page="Dashboard">Dashboard</button><button data-page="Accounts">Accounts</button><button data-page="Content">Content</button></nav><main><section class="card"><b>Data lokal</b> <button onclick="exportJSON()">Download JSON Backup</button> <label>Restore JSON <input type="file" accept="application/json" onchange="importJSON(this)"></label></section><h2 id="title">Dashboard</h2><div id="view"></div></main><script>
const KEY='clipper-hub:data:v1';let db=JSON.parse(localStorage.getItem(KEY)||'{"accounts":[],"content":[]}');db.accounts ||= [];db.content ||= [];function save(){localStorage.setItem(KEY,JSON.stringify(db));render()};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}let page='Dashboard';document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()});function render(){document.getElementById('title').textContent=page;let v=document.getElementById('view');if(page==='Dashboard'){v.innerHTML=`<div class="grid"><div class="card">Accounts<div class="num">${db.accounts.length}</div></div><div class="card">Total Content<div class="num">${db.content.length}</div></div><div class="card">Published<div class="num">${db.content.filter(x=>x.status==='Published').length}</div></div><div class="card">In Editing<div class="num">${db.content.filter(x=>x.status==='Editing').length}</div></div></div><section class="card"><h3>Recent Content</h3>${tableContent()}</section>`}else if(page==='Accounts'){v.innerHTML=`<section class="card"><h3>Add Account</h3><input id="platform" placeholder="Platform (TikTok/YouTube)"><input id="handle" placeholder="Handle / username"><input id="name" placeholder="Display name"><select id="status"><option>Active</option><option>Paused</option><option>Restricted</option></select><button onclick="addAccount()">Save Account</button></section><section class="card"><h3>Account List</h3><input id="accountSearch" placeholder="Search platform / username" oninput="renderAccountRows()"><table><tbody id="accountRows"><tr><th>Platform</th><th>Handle</th><th>Name</th><th>Status</th><th>Action</th></tr>${accountRows()}</tbody></table></section>`}else{v.innerHTML=`<section class="card"><h3>Create Content</h3><input id="ctitle" placeholder="Content title"><select id="acc">${db.accounts.map(a=>`<option value="${a.id}">${esc(a.handle)}</option>`).join('')}</select><select id="cstatus"><option>Idea</option><option>Scripting</option><option>Editing</option><option>Review</option><option>Scheduled</option><option>Published</option></select><button onclick="addContent()">Save Content</button></section><section class="card"><h3>Content List</h3><input id="contentSearch" placeholder="Search title / account" oninput="renderContentRows()"><select id="contentFilter" onchange="renderContentRows()"><option value="">All status</option><option>Idea</option><option>Scripting</option><option>Editing</option><option>Review</option><option>Scheduled</option><option>Published</option></select>${tableContent()}</section>`}}function accountRows(){let q=(document.getElementById('accountSearch')?.value||'').toLowerCase();return db.accounts.filter(a=>(a.platform+' '+a.handle+' '+a.name).toLowerCase().includes(q)).map(a=>`<tr><td>${esc(a.platform)}</td><td>${esc(a.handle)}</td><td>${esc(a.name)}</td><td>${esc(a.status)}</td><td><button onclick="editAccount('${a.id}')">Edit</button> <button onclick="delAccount('${a.id}')">Delete</button></td></tr>`).join('')}function tableContent(){return `<table><tr><th>Title</th><th>Account</th><th>Status</th><th>Action</th></tr><tbody id="contentRows">${contentRows()}</tbody></table>`}function contentRows(){let q=(document.getElementById('contentSearch')?.value||'').toLowerCase(),f=document.getElementById('contentFilter')?.value||'';return db.content.filter(c=>(c.title+' '+(db.accounts.find(a=>a.id===c.accountId)?.handle||'')).toLowerCase().includes(q)&&(!f||c.status===f)).map(c=>`<tr><td>${esc(c.title)}</td><td>${esc(db.accounts.find(a=>a.id===c.accountId)?.handle||'Account missing')}</td><td>${esc(c.status)}</td><td><button onclick="editContent('${c.id}')">Edit</button> <button onclick="delContent('${c.id}')">Delete</button></td></tr>`).join('')}function renderAccountRows(){document.getElementById('accountRows').innerHTML='<tr><th>Platform</th><th>Handle</th><th>Name</th><th>Status</th><th>Action</th></tr>'+accountRows()}function renderContentRows(){document.getElementById('contentRows').innerHTML=contentRows()}function editAccount(id){let a=db.accounts.find(x=>x.id===id);if(!a)return;let platform=prompt('Platform',a.platform);if(platform===null)return;let handle=prompt('Username/handle',a.handle);if(handle===null)return;let name=prompt('Display name',a.name||'');if(name===null)return;let status=prompt('Status (Active/Paused/Restricted)',a.status);if(status===null)return;if(!platform.trim()||!handle.trim()){alert('Platform dan username wajib');return}Object.assign(a,{platform:platform.trim(),handle:handle.trim(),name:name.trim(),status:status.trim()});save()}function editContent(id){let c=db.content.find(x=>x.id===id);if(!c)return;let title=prompt('Judul content',c.title);if(title===null)return;let account=db.accounts.find(a=>a.id===c.accountId);let handle=prompt('Username account (kosong = tanpa perubahan)',account?.handle||'');if(handle===null)return;let status=prompt('Status content',c.status);if(status===null)return;if(!title.trim()){alert('Judul wajib');return}if(handle.trim()){let target=db.accounts.find(a=>a.handle===handle.trim());if(!target){alert('Account tidak ditemukan');return}c.accountId=target.id}Object.assign(c,{title:title.trim(),status:status.trim()});save()}function addAccount(){let platform=document.getElementById('platform').value.trim(),handle=document.getElementById('handle').value.trim(),name=document.getElementById('name').value.trim();if(!platform||!handle){alert('Platform dan handle wajib diisi');return}db.accounts.push({id:crypto.randomUUID(),platform,handle,name,status:document.getElementById('status').value});save()}function delAccount(id){if(db.content.some(c=>c.accountId===id)){alert('Account masih dipakai Content. Hapus atau pindahkan content terlebih dahulu.');return}if(confirm('Hapus account ini?')){db.accounts=db.accounts.filter(a=>a.id!==id);save()}}function exportJSON(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='clipper-hub-backup.json';a.click();URL.revokeObjectURL(url)}function importJSON(input){let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!Array.isArray(x.accounts)||!Array.isArray(x.content))throw Error('Format harus memiliki accounts dan content berupa array');if(x.content.some(c=>c.accountId&&!x.accounts.some(a=>a.id===c.accountId)))throw Error('Ada content dengan accountId yang tidak valid');if(confirm('Import akan mengganti data lokal sekarang. Lanjutkan?')){db=x;save();alert('Restore berhasil')}}catch(e){alert('JSON tidak valid: '+e.message)}input.value=''};reader.readAsText(file)}function addContent(){let title=document.getElementById('ctitle').value.trim();if(!title){alert('Judul wajib diisi');return}db.content.push({id:crypto.randomUUID(),title,accountId:document.getElementById('acc').value,status:document.getElementById('cstatus').value});save()}function delContent(id){if(confirm('Hapus content?')){db.content=db.content.filter(c=>c.id!==id);save()}}render();
</script></body></html>
