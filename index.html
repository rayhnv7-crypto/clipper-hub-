<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clipper Hub</title><style>body{margin:0;background:#101513;color:#e7f2ec;font:15px system-ui}header{padding:22px 28px;border-bottom:1px solid #26342d;display:flex;justify-content:space-between}h1{font-size:20px;margin:0;color:#6ee7b7}nav{display:flex;gap:10px;padding:18px 28px;flex-wrap:wrap}button{background:#18241e;color:#c8e8d7;border:1px solid #2c4437;border-radius:9px;padding:10px 14px;cursor:pointer}button.active{background:#14583e;border-color:#28a879;color:white}main{padding:10px 28px 32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#17201b;border:1px solid #293a30;border-radius:14px;padding:18px}.muted{color:#8ca99a}.num{font-size:28px;color:#6ee7b7;margin-top:8px}table{width:100%;border-collapse:collapse;margin-top:14px}td,th{text-align:left;padding:11px;border-bottom:1px solid #2b3b31}input,select{background:#101713;border:1px solid #314438;color:#e7f2ec;padding:9px;border-radius:8px;margin:4px}section{margin:16px 0}.hide{display:none}</style></head><body><header><h1>Clipper Hub</h1><span class="muted">Operations Workspace</span></header><nav><button class="active" data-page="Dashboard">Dashboard</button><button data-page="Accounts">Accounts</button><button data-page="Content">Content</button></nav><main><h2 id="title">Dashboard</h2><div id="view"></div></main><script>
const KEY='clipper-hub:data:v1';let db=JSON.parse(localStorage.getItem(KEY)||'{"accounts":[],"content":[]}');db.accounts ||= [];db.content ||= [];function save(){localStorage.setItem(KEY,JSON.stringify(db));render()};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}let page='Dashboard';document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()});function render(){document.getElementById('title').textContent=page;let v=document.getElementById('view');if(page==='Dashboard'){v.innerHTML=`<div class="grid"><div class="card">Accounts<div class="num">${db.accounts.length}</div></div><div class="card">Total Content<div class="num">${db.content.length}</div></div><div class="card">Published<div class="num">${db.content.filter(x=>x.status==='Published').length}</div></div><div class="card">In Editing<div class="num">${db.content.filter(x=>x.status==='Editing').length}</div></div></div><section class="card"><h3>Recent Content</h3>${tableContent()}</section>`}else if(page==='Accounts'){v.innerHTML=`<section class="card"><h3>Add Account</h3><input id="platform" placeholder="Platform (TikTok/YouTube)"><input id="handle" placeholder="Handle / username"><input id="name" placeholder="Display name"><select id="status"><option>Active</option><option>Paused</option><option>Restricted</option></select><button onclick="addAccount()">Save Account</button></section><section class="card"><h3>Account List</h3><table><tr><th>Platform</th><th>Handle</th><th>Name</th><th>Status</th><th>Action</th></tr>${db.accounts.map(a=>`<tr><td>${esc(a.platform)}</td><td>${esc(a.handle)}</td><td>${esc(a.name)}</td><td>${esc(a.status)}</td><td><button onclick="delAccount('${a.id}')">Delete</button></td></tr>`).join('')}</table></section>`}else{v.innerHTML=`<section class="card"><h3>Create Content</h3><input id="ctitle" placeholder="Content title"><select id="acc">${db.accounts.map(a=>`<option value="${a.id}">${esc(a.handle)}</option>`).join('')}</select><select id="cstatus"><option>Idea</option><option>Scripting</option><option>Editing</option><option>Review</option><option>Scheduled</option><option>Published</option></select><button onclick="addContent()">Save Content</button></section><section class="card"><h3>Content List</h3>${tableContent()}</section>`}}function tableContent(){return `<table><tr><th>Title</th><th>Account</th><th>Status</th><th>Action</th></tr>${db.content.map(c=>`<tr><td>${esc(c.title)}</td><td>${esc(db.accounts.find(a=>a.id===c.accountId)?.handle||'Account missing')}</td><td>${esc(c.status)}</td><td><button onclick="delContent('${c.id}')">Delete</button></td></tr>`).join('')}</table>`}function addAccount(){let platform=document.getElementById('platform').value.trim(),handle=document.getElementById('handle').value.trim(),name=document.getElementById('name').value.trim();if(!platform||!handle){alert('Platform dan handle wajib diisi');return}db.accounts.push({id:crypto.randomUUID(),platform,handle,name,status:document.getElementById('status').value});save()}function delAccount(id){if(db.content.some(c=>c.accountId===id)){alert('Account masih dipakai Content. Hapus atau pindahkan content terlebih dahulu.');return}if(confirm('Hapus account ini?')){db.accounts=db.accounts.filter(a=>a.id!==id);save()}}function addContent(){let title=document.getElementById('ctitle').value.trim();if(!title){alert('Judul wajib diisi');return}db.content.push({id:crypto.randomUUID(),title,accountId:document.getElementById('acc').value,status:document.getElementById('cstatus').value});save()}function delContent(id){if(confirm('Hapus content?')){db.content=db.content.filter(c=>c.id!==id);save()}}render();
</script></body></html>
