<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clipper Hub — OAuth Callback</title><style>body{margin:0;background:#101514;color:#e8f0eb;font:15px system-ui;display:grid;min-height:100vh;place-items:center}.box{max-width:480px;margin:20px;padding:28px;border:1px solid #29352f;border-radius:16px;background:#171e1b}h1{font-size:22px}p{color:#91a49a;line-height:1.6}.status{padding:12px;border-radius:8px;background:#202b25}</style></head><body><main class="box"><h1>OAuth — Clipper Hub</h1><div id="status" class="status">Memeriksa hasil otorisasi…</div><p id="detail">Callback provider diterima. Proses penyimpanan koneksi memerlukan sesi login aplikasi yang aktif.</p><p><a href="/" style="color:#42d6a0">Kembali ke Clipper Hub</a></p></main><script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL="https://zfrvrqqhrwdwcymnarrh.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmcnZycXFocndkd2N5bW5hcnJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0NTcxNTEsImV4cCI6MjEwOTAzMzE1MX0.X0gf18wB8TbZ_45KxlP1lzHoUyGyb3GgDwZXtqu3ZCU";
const status=document.querySelector("#status"),detail=document.querySelector("#detail"),params=new URLSearchParams(location.search),code=params.get("code"),state=params.get("state"),error=params.get("error");
if(error){status.textContent="Otorisasi ditolak";detail.textContent=params.get("error_description")||error;}
else if(!code||!state){status.textContent="Callback tidak valid";detail.textContent="Parameter code/state tidak ditemukan. Mulai koneksi dari dashboard.";}
else{const sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const{data:{session}}=await sb.auth.getSession();if(!session){status.textContent="Sesi aplikasi tidak ditemukan";detail.textContent="Login ke Clipper Hub terlebih dahulu, lalu ulangi Connect Account. Token provider belum disimpan.";}else{const provider=localStorage.getItem("clipper-hub:oauth-provider");if(!provider){status.textContent="Provider tidak diketahui";detail.textContent="Silakan mulai Connect Account dari dashboard.";}else{const{data,error}=await sb.functions.invoke("social-oauth-callback",{body:{provider,code,state}});if(error||data?.error){status.textContent="Koneksi gagal";detail.textContent=data?.error||error.message;}else{status.textContent="Akun berhasil terhubung";detail.textContent="Provider: "+provider+" • "+(data.account_name||"");}}}}
</script></body></html>
