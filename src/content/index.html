<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clipper Hub · Content</title>
<style>
:root{color-scheme:dark;--bg:#101411;--panel:#19211b;--line:#2c3b30;--text:#e7eee8;--muted:#94a69a;--accent:#35d07f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif;padding:28px}main{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0 0 8px;font-size:26px}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}input,select,textarea{width:100%;background:#101711;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;margin-bottom:12px}button{background:var(--accent);color:#062012;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}button.secondary{background:#26352a;color:var(--text);border:1px solid var(--line)}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}@media(max-width:650px){body{padding:14px}table{font-size:12px}th,td{padding:8px}}
</style></head><body><main>
<div class="top"><div><h1>Content Management</h1><div class="muted">Kelola konten dan hubungkan ke akun sosial.</div></div><a class="muted" href="../index.html">← Dashboard</a></div>
<section class="panel"><h3 id="formTitle">Tambah konten</h3><form id="form"><input id="id" type="hidden"><div class="grid">
<div><label>Judul konten</label><input id="title" required placeholder="Judul / topik"></div>
<div><label>Akun</label><select id="account" required></select></div>
<div><label>Platform</label><select id="platform"><option>TikTok</option><option>Instagram</option><option>YouTube</option><option>Other</option></select></div>
<div><label>Status produksi</label><select id="status"><option>idea</option><option>scripting</option><option>editing</option><option>review</option><option>scheduled</option><option>published</option></select></div>
</div><label>Hook / catatan</label><textarea id="hook" rows="2"></textarea><label>Caption</label><textarea id="caption" rows="2"></textarea><button type="submit">Simpan konten</button> <button type="button" class="secondary" id="cancel">Reset form</button></form></section>
<section class="panel"><div class="top"><h3>Daftar konten</h3><input id="search" placeholder="Cari judul..." style="max-width:240px;margin:0"></div><div class="muted" id="summary"></div><table><thead><tr><th>Judul</th><th>Akun</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></section>
</main><script>
const AKEY='clipper-hub:accounts:v1',CKEY='clipper-hub:content:v1';
const $=id=>document.getElementById(id);const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return []}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function accounts(){return read(AKEY)}function contents(){return read(CKEY)}
function accountOptions(selected=''){const list=accounts();$('account').innerHTML='<option value="">Pilih akun…</option>'+list.map(a=>'<option value="'+a.id+'">'+esc(a.handle||a.username||a.name||a.displayName||a.platform||a.id)+'</option>').join('');$('account').value=selected}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function reset(){ $('form').reset();$('id').value='';$('formTitle').textContent='Tambah konten';accountOptions()}
function render(){let list=contents(),q=$('search').value.toLowerCase();list=list.filter(c=>(c.title||'').toLowerCase().includes(q));const as=accounts();$('summary').textContent=contents().length+' konten total · '+as.length+' akun tersedia';$('rows').innerHTML=list.map(c=>{let a=as.find(x=>x.id===c.accountId);return '<tr><td>'+esc(c.title)+'</td><td>'+esc(a?.handle||a?.username||a?.name||a?.displayName||a?.platform||'Akun tidak ditemukan')+'</td><td>'+esc(c.status)+'</td><td><button class="secondary" onclick="editItem(\''+c.id+'\')">Edit</button> <button class="secondary" onclick="deleteItem(\''+c.id+'\')">Hapus</button></td></tr>'}).join('')||'<tr><td colspan="4" class="muted">Belum ada konten. Tambahkan konten pertama.</td></tr>'}
$('form').addEventListener('submit',e=>{e.preventDefault();if(!accounts().length){alert('Buat akun terlebih dahulu di Accounts.');return}let list=contents(),id=$('id').value||crypto.randomUUID(),old=list.find(x=>x.id===id);let item={id,title:$('title').value.trim(),accountId:$('account').value,platform:$('platform').value,status:$('status').value,hook:$('hook').value,caption:$('caption').value,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};write(CKEY,old?list.map(x=>x.id===id?item:x):[item,...list]);reset();render()});
window.editItem=id=>{let c=contents().find(x=>x.id===id);if(!c)return;$('id').value=c.id;$('title').value=c.title;$('platform').value=c.platform;$('status').value=c.status;$('hook').value=c.hook||'';$('caption').value=c.caption||'';accountOptions(c.accountId);$('formTitle').textContent='Edit konten';window.scrollTo({top:0,behavior:'smooth'})};
window.deleteItem=id=>{if(confirm('Hapus konten ini?')){write(CKEY,contents().filter(x=>x.id!==id));render()}};
$('cancel').onclick=reset;$('search').oninput=render;accountOptions();render();
</script></body></html>
